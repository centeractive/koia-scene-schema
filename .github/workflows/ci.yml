name: CI

on:
  push:
  pull_request:

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run bundle && npm test

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B verify -Drevision=0.0.0-SNAPSHOT

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated models are up to date
        run: |
          pip install datamodel-code-generator==0.86.0
          ./generate.sh "$RUNNER_TEMP/v1.py"
          diff koia_scene_model/v1.py "$RUNNER_TEMP/v1.py"
      - run: pip install ".[test]" && pytest
      - name: Wheel builds from the sdist
        run: pip install build && python -m build
